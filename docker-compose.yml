version: "3.9"

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neurax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Python FastAPI — AI Engine ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurax-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_DIR=/app/data/vectordb
      - GRAPH_OUTPUT_DIR=/app/data/output/graphs
      - CONFIDENCE_THRESHOLD_HIGH=0.85
      - CONFIDENCE_THRESHOLD_MEDIUM=0.60
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js — BFF / API Gateway ───────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: neurax-gateway
    ports:
      - "3001:3001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_API_URL=http://backend:8000
      - GATEWAY_PORT=3001
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React — Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurax-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  redis_data:
